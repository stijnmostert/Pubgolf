<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pubgolf scorebord</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ea;--surface:#fff;--line:#cfd9c8;--text:#17261f;--muted:#5d7066;--accent:#8a6512;--accent-bg:#f3e6bf;--under:#1f7a3a;--over:#b4472a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14231d;--surface:#1d3329;--line:#2f4a3d;--text:#ece8dc;--muted:#9bb0a4;--accent:#d4a83c;--accent-bg:#3a3318;--under:#7fd28f;--over:#ef8a6b}}
:root[data-theme="dark"]{--bg:#14231d;--surface:#1d3329;--line:#2f4a3d;--text:#ece8dc;--muted:#9bb0a4;--accent:#d4a83c;--accent-bg:#3a3318;--under:#7fd28f;--over:#ef8a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hole{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hole .t{flex:1;text-align:center}
.hole .t b{display:block;font-size:1.25rem;font-weight:800}
.hole .t span{color:var(--muted);font-size:.9rem}
.nb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1.3rem;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1.5rem;font-weight:600;cursor:pointer}
.step:active{background:var(--accent-bg)}
.val{width:44px;text-align:center;font-size:1.6rem;font-weight:800}
.val.empty{color:var(--muted)}
.rank{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rank.first{border-color:var(--accent);background:var(--accent-bg)}
.rank .pos{font-size:1.4rem;font-weight:800;color:var(--accent)}
.rank .meta{color:var(--muted);font-size:.8rem}
.par{font-weight:800;font-size:1.25rem;min-width:44px;text-align:right}
.tot{color:var(--muted);min-width:36px;text-align:right}
.under{color:var(--under)}.over{color:var(--over)}
.wrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:600;border-right:1px solid var(--line)}
thead th{color:var(--muted);font-weight:600}
h2{font-size:1.05rem;margin:22px 0 8px}
.set{display:flex;gap:8px;margin-bottom:8px}
.set input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.set input.p{flex:0 0 64px;text-align:center}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn.danger{color:var(--over)}
.x{width:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--over);font-size:1.1rem;cursor:pointer}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
</style>
</head>
<body>
<main>
<h1>Pubgolf scorebord</h1>
<p id="st" class="hint" style="margin:0 0 10px"></p>
<form id="login" hidden><h2>Wachtwoord</h2><p class="hint">Vul het wachtwoord in dat je van de organisator hebt gekregen.</p><div class="set"><input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord"><button class="btn" type="submit">Openen</button></div><p id="perr" class="hint over"></p></form>
<div id="gate" hidden>
<nav role="tablist">
<button role="tab" data-v="score">Scoren</button>
<button role="tab" data-v="stand">Stand</button>
<button role="tab" data-v="set">Instellingen</button>
</nav>
<div id="app"></div>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// === PLAK HIER JE FIREBASE-CONFIG (zie uitleg) ===
const FB={apiKey:"AIzaSyCRRGJJV-w9jw8sUxPYoT4d2XXI7PSIaK8",authDomain:"pubgolf-df259.firebaseapp.com",databaseURL:"https://pubgolf-df259-default-rtdb.europe-west1.firebasedatabase.app",projectId:"pubgolf-df259",appId:"1:556743240473:web:5e24991e59433c2e47b388"};
// =================================================
const LOCAL=FB.apiKey.startsWith("PLAK");
const def=()=>({teams:[1,2,3,4,5,6].map(i=>({id:"t"+i,name:"Team "+i})),holes:Array.from({length:16},(_,i)=>({name:"Kroeg "+(i+1),par:3})),scores:{}});
let S=def(),V={view:"score",hole:0},db=null;
const arr=x=>Array.isArray(x)?x.filter(Boolean):Object.values(x||{});
try{const v=JSON.parse(localStorage.getItem("pubgolf-view"));if(v)V=v}catch(e){}
if(LOCAL){try{const s=JSON.parse(localStorage.getItem("pubgolf-v2"));if(s&&s.teams)S=s}catch(e){}}
const saveV=()=>{try{localStorage.setItem("pubgolf-view",JSON.stringify(V))}catch(e){}};
const saveL=()=>{if(LOCAL)try{localStorage.setItem("pubgolf-v2",JSON.stringify(S))}catch(e){}};
const st=document.getElementById("st");
if(LOCAL){document.getElementById("gate").hidden=false;st.textContent="Lokale modus: scores worden niet gedeeld. Voeg de Firebase-config toe om te delen."}
else{
firebase.initializeApp(FB);db=firebase.database();
const EMAIL="pubgolf@pubgolf.app";
const gate=document.getElementById("gate"),login=document.getElementById("login"),perr=document.getElementById("perr");
let started=false;
function start(){
if(started)return;started=true;
db.ref(".info/connected").on("value",s=>{st.textContent=s.val()?"Live verbonden: iedereen ziet dezelfde stand":"Geen verbinding, we proberen opnieuw…"});
db.ref("bord").on("value",snap=>{
const d=snap.val();
if(!d){const x=def();db.ref("bord").set({teams:x.teams,holes:x.holes});return}
S.teams=arr(d.teams);S.holes=arr(d.holes);S.scores=d.scores||{};
if(V.hole>=S.holes.length)V.hole=0;
if(!(document.activeElement&&document.activeElement.tagName==="INPUT"))render();
});}
firebase.auth().onAuthStateChanged(u=>{
if(u){login.hidden=true;gate.hidden=false;start()}
else{login.hidden=false;gate.hidden=true;st.textContent=""}
});
login.addEventListener("submit",e=>{e.preventDefault();perr.textContent="";
firebase.auth().signInWithEmailAndPassword(EMAIL,document.getElementById("pw").value).catch(err=>{const c=err.code||"";perr.textContent=(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found")?"Dat wachtwoord klopt niet.":"Inloggen mislukt: "+c})});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(t,h)=>(S.scores[t]||{})[h];
function wScore(t,h,v){
const o=S.scores[t]||(S.scores[t]={});
if(v==null)delete o[h];else o[h]=v;
if(db){const r=db.ref(`bord/scores/${t}/${h}`);v==null?r.remove():r.set(v)}else saveL();
}
function wTeams(){db?db.ref("bord/teams").set(S.teams):saveL()}
function wHoles(){db?db.ref("bord/holes").set(S.holes):saveL()}
function stats(t){let tot=0,diff=0,n=0;S.holes.forEach((H,i)=>{const v=get(t.id,i);if(typeof v==="number"){tot+=v;diff+=v-H.par;n++}});return{tot,diff,n}}
const fmt=d=>d>0?"+"+d:d===0?"0":String(d);
const cls=d=>d<0?"under":d>0?"over":"";
const app=document.getElementById("app");
function render(){
document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===V.view));
if(V.view==="score")score();else if(V.view==="stand")stand();else settings();
}
function score(){
const H=S.holes[V.hole];
let h=`<div class="hole"><button class="nb" data-a="prev" aria-label="Vorige kroeg">‹</button><div class="t"><b>${esc(H.name)}</b><span>Kroeg ${V.hole+1} van ${S.holes.length} · par ${H.par}</span></div><button class="nb" data-a="next" aria-label="Volgende kroeg">›</button></div>`;
S.teams.forEach(t=>{const v=get(t.id,V.hole);
h+=`<div class="row"><span class="n">${esc(t.name)}</span><button class="step" data-a="dec" data-t="${t.id}" aria-label="Minder slokken ${esc(t.name)}">−</button><span class="val ${v==null?"empty":""}">${v==null?"–":v}</span><button class="step" data-a="inc" data-t="${t.id}" aria-label="Meer slokken ${esc(t.name)}">+</button></div>`});
app.innerHTML=h+`<p class="hint">Vul het aantal slokken in. De eerste tik op + zet de score op par.</p>`;
}
function stand(){
const r=S.teams.map(t=>({t,...stats(t)})).sort((a,b)=>(a.n===0)-(b.n===0)||a.diff-b.diff||a.tot-b.tot);
let h="";
r.forEach((x,i)=>{h+=`<div class="rank ${i===0&&x.n?"first":""}"><span class="pos">${i+1}</span><div><div style="font-weight:600">${esc(x.t.name)}</div><div class="meta">${x.n} van ${S.holes.length} kroegen</div></div><span class="tot">${x.tot} sl.</span><span class="par ${cls(x.diff)}">${x.n?fmt(x.diff):"–"}</span></div>`});
h+=`<div class="wrap"><table><thead><tr><th>Team</th>${S.holes.map((_,i)=>`<th>${i+1}</th>`).join("")}<th>Tot</th></tr></thead><tbody>`;
h+=`<tr><td style="color:var(--muted)">Par</td>${S.holes.map(x=>`<td style="color:var(--muted)">${x.par}</td>`).join("")}<td style="color:var(--muted)">${S.holes.reduce((a,x)=>a+x.par,0)}</td></tr>`;
S.teams.forEach(t=>{const s=stats(t);h+=`<tr><td>${esc(t.name)}</td>${S.holes.map((H,i)=>{const v=get(t.id,i);return`<td class="${v==null?"":cls(v-H.par)}">${v==null?"·":v}</td>`}).join("")}<td><b>${s.tot}</b></td></tr>`});
app.innerHTML=h+`</tbody></table></div>`;
}
function settings(){
let h=`<h2>Teams (max 10)</h2>`;
S.teams.forEach(t=>{h+=`<div class="set"><input data-a="tname" data-t="${t.id}" value="${esc(t.name)}" aria-label="Teamnaam"><button class="x" data-a="deltm" data-t="${t.id}" aria-label="Verwijder ${esc(t.name)}">✕</button></div>`});
if(S.teams.length<10)h+=`<button class="btn" data-a="addtm">Team toevoegen</button>`;
h+=`<h2>Kroegen en par</h2><p class="hint">Naam van de kroeg, en par in slokken. Wijzigingen zien alle spelers direct.</p>`;
S.holes.forEach((x,i)=>{h+=`<div class="set"><input data-a="hname" data-i="${i}" value="${esc(x.name)}" aria-label="Kroeg ${i+1}"><input class="p" type="number" min="1" max="20" inputmode="numeric" data-a="hpar" data-i="${i}" value="${x.par}" aria-label="Par kroeg ${i+1}"></div>`});
h+=`<h2>Opnieuw beginnen</h2><button class="btn danger" data-a="reset">Alle scores wissen</button>`;
app.innerHTML=h;
}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;V.view=b.dataset.v;saveV();render()});
app.addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,t=b.dataset.t;
if(a==="prev"){V.hole=(V.hole+S.holes.length-1)%S.holes.length;saveV()}
else if(a==="next"){V.hole=(V.hole+1)%S.holes.length;saveV()}
else if(a==="inc"){const v=get(t,V.hole);wScore(t,V.hole,v==null?S.holes[V.hole].par:v+1)}
else if(a==="dec"){const v=get(t,V.hole);if(v!=null)wScore(t,V.hole,v<=1?null:v-1)}
else if(a==="addtm"){if(S.teams.length<10){S.teams.push({id:"t"+Date.now(),name:"Team "+(S.teams.length+1)});wTeams()}}
else if(a==="deltm"){if(confirm("Dit team en de scores verwijderen?")){S.teams=S.teams.filter(x=>x.id!==t);delete S.scores[t];wTeams();if(db)db.ref(`bord/scores/${t}`).remove();else saveL()}}
else if(a==="reset"){if(confirm("Alle scores wissen voor iedereen?")){S.scores={};if(db)db.ref("bord/scores").remove();else saveL()}}
else return;
render();
});
app.addEventListener("change",e=>{
const i=e.target,a=i.dataset.a;
if(a==="tname"){S.teams.find(x=>x.id===i.dataset.t).name=i.value;wTeams()}
else if(a==="hname"){S.holes[+i.dataset.i].name=i.value;wHoles()}
else if(a==="hpar"){const v=parseInt(i.value,10);if(v>0){S.holes[+i.dataset.i].par=v;wHoles()}}
});
render();
</script>
</body>
</html>
